<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Service Dashboard</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; background: #f4f4f9; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        input { width: 90%; margin-bottom: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #00ADD8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #008eb3; }
        .user-card { margin-top: 10px; padding: 10px; background: #e7f3ff; border-radius: 4px; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { border-bottom: 1px solid #eee; padding: 5px 0; }
    </style>
</head>
<body>

    <section>
        <h2>Register</h2>
        <input type="text" id="regFirst" placeholder="First Name">
        <input type="text" id="regLast" placeholder="Last Name">
        <input type="text" id="regUser" placeholder="Username">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Password">
        <button onclick="register()">Create Account</button>
    </section>

    <section>
        <h2>Login</h2>
        <input type="email" id="logEmail" placeholder="Email">
        <input type="password" id="logPass" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="userInfo" class="user-card" style="display:none">
            <strong>Welcome, <span id="uName"></span></strong><br>
            Balance: ₽<span id="uBalance"></span><br>
            Email: <span id="uEmail"></span>
        </div>
    </section>

    <section>
        <h2>Payment</h2>
        <p style="font-size: 0.8rem; color: #666;">Auth required (JWT in Cookies)</p>
        <input type="number" id="payAmount" placeholder="Amount (e.g. 100)">
        <button onclick="createPayment()" style="background: #28a745;">Pay via YooKassa</button>
    </section>

    <aside style="flex: 1; background: white; padding: 20px; border-radius: 8px;">
        <button onclick="getAllUsers()">Refresh User List</button>
        <h2>System Users</h2>
        <table>
            <tbody id="userList"></tbody>
        </table>
    </aside>

    <script>
        const API_BASE = 'http://127.0.0.1:8080/api/v1';

        // Универсальный конфиг для fetch с поддержкой Cookies
        const fetchOptions = (method, body = null) => ({
            method: method,
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // ВАЖНО: передает куки (refresh/access токены)
            body: body ? JSON.stringify(body) : null
        });

        async function register() {
            const payload = {
                first_name: document.getElementById('regFirst').value,
                last_name: document.getElementById('regLast').value,
                username: document.getElementById('regUser').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value
            };
            try {
                const res = await fetch(`${API_BASE}/new`, fetchOptions('POST', payload));
                const data = await res.json();
                alert(data.message || "Registered!");
            } catch (err) { alert("Reg error"); }
        }

        async function login() {
    const payload = {
        email: document.getElementById('logEmail').value,
        password: document.getElementById('logPass').value
    };

    try {
        // Теперь шлем POST, так как ты поменял это на сервере
        const res = await fetch(`${API_BASE}/login`, fetchOptions('POST', payload));
        
        if (!res.ok) {
            alert("Wrong credentials");
            return;
        }

        const user = await res.json();
        
        
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('uName').innerText = user.username;
        document.getElementById('uBalance').innerText = user.balance;
        document.getElementById('uEmail').innerText = user.email;
        
    } catch (err) {
        console.error("Login error:", err);
    }
}

        async function createPayment() {
            const price = document.getElementById('payAmount').value;
            try {
                // Роут защищен JWTMiddleware, куки подцепятся автоматически из-за credentials: include
                const res = await fetch(`${API_BASE}/auth/payment`, fetchOptions('POST', { price: Number(price) }));
                const data = await res.json();
                
                if (data.result) {
                    window.location.href = data.result; // Редирект на ЮKassa
                } else {
                    alert("Error creating payment link");
                }
            } catch (err) { alert("Payment error. Maybe unauthorized?"); }
        }

        async function getAllUsers() {
    try {
        // Если ты поменял /users на POST, смени 'GET' на 'POST' тут:
        const response = await fetch(`${API_BASE}/users`, fetchOptions('GET')); 
        const data = await response.json(); 
        
        const list = document.getElementById('userList');
        list.innerHTML = ''; // Очищаем список перед обновлением

        // Проходим по массиву юзеров
        data.forEach(user => {
            // ВАЖНО: используй имена полей из твоих JSON-тегов в Go (например, user.username)
            const row = `
                <tr>
                     <td><strong>${user.first_name || 'N/A'}</strong></td>
                    <td><strong>${user.username || 'N/A'}</strong></td>
                    <td>${user.email || ''}</td>
                    <td>${user.balance || 0}₽</td>
                    <td>${user.id || ''}</td>
                </tr>
            `;
            list.innerHTML += row;
        });
    } catch (err) {
        console.error('Ошибка при получении списка:', err);
    }
}
    </script>
</body>
</html>
