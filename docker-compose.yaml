services:
  app:
    env_file:
      - .env
    build: 
      context: ./main_backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db
  db: 
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"